server.port=8080

# H2 in-memory for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable real Auth0 JWKS fetch — TestSecurityConfig provides a local JwtDecoder
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://test.auth0.com/

auth0.audience=https://twitter-clone-api
cors.allowed-origins=http://localhost:5173

springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
