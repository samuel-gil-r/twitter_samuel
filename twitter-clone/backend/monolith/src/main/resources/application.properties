server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/twitter
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Auth0 / OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-gtvauehvyprmkd80.us.auth0.com/

# Custom properties read in JwtDecoderConfig / CorsConfig
auth0.audience=https://twitter-clone-api
cors.allowed-origins=http://localhost:5173

# Swagger
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
